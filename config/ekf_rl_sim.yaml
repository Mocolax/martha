ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    publish_tf: true
    publish_acceleration: false

    # Igual que en hardware, el filtro integra velocidades de rueda en vez de
    # reutilizar la pose absoluta. Esto permite reiniciar/teletransportar el
    # robot en Gazebo sin entrenar una dependencia de la pose del controlador.
    odom0: /mecanum_drive_controller/odometry
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, true,
      false, false, false
    ]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # Se fusiona gyro Z con el giro estimado por las ruedas. La orientación
    # absoluta de la IMU no forma parte del contrato común sim/hardware.
    imu0: /imu/data
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
