slam_toolbox:
  ros__parameters:
    use_sim_time: true

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    mode: mapping
    resolution: 0.05
    max_laser_range: 12.0

    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    transform_timeout: 0.5
    tf_buffer_duration: 30.0